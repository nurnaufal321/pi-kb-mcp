# Portainer stack for pi-kb-mcp (private, single-user HTTP server).
#
# Deploy in Portainer:  Stacks -> Add stack -> Repository
#   Repository URL:     https://github.com/nurnaufal321/pi-kb-mcp
#   Compose path:       docker-compose.yml   (Portainer's default)
#
# The image is prebuilt and published to ghcr.io by GitHub Actions, so your
# host only pulls it. Nothing is compiled on your box.
#   Environment:        PI_KB_MCP_SECRET     = <a long random string>
#                       PI_KB_PROXY_NETWORK  = <your reverse proxy's docker network>
#
# Generate the secret with:
#   python -c 'import secrets; print(secrets.token_urlsafe(32))'
#
# This server holds YOUR AVEVA session. Anyone with the URL and the secret
# queries the knowledge base as you, under your entitlement and your identity.
# Keep both private; never advertise this endpoint.
services:
  pi-kb-mcp:
    # Prebuilt by GitHub Actions, so your host only pulls — it never builds.
    # To build locally instead, comment out `image:` and uncomment `build:`.
    image: ghcr.io/nurnaufal321/pi-kb-mcp:latest
    # build:
    #   context: .
    #   dockerfile: Dockerfile.serve
    pull_policy: always
    restart: unless-stopped
    environment:
      # Required. The server exits at startup if this is under 24 characters.
      PI_KB_MCP_SECRET: ${PI_KB_MCP_SECRET:?set PI_KB_MCP_SECRET in the stack environment}
    volumes:
      # Your portal session cookies. Kept in a volume so they survive redeploys
      # and are never baked into the image.
      - pi-kb-session:/data
    networks:
      # Your reverse proxy's network, so it can reach this container directly.
      # Set PI_KB_PROXY_NETWORK in the stack environment to its name; find it with
      #   docker inspect <proxy-container> -f '{{range $k,$v := .NetworkSettings.Networks}}{{$k}}{{end}}'
      # Then point the proxy at  http://pi-kb-mcp:8080
      - proxy
    # No ports are published on purpose. The proxy reaches this container over
    # the Docker network, so nothing is exposed on the host and the only route
    # in is through your proxy. If you do need a host port, uncomment:
    # ports:
    #   - "${PI_KB_BIND:-127.0.0.1:9123}:8080"
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request;urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 20s

networks:
  proxy:
    external: true
    name: ${PI_KB_PROXY_NETWORK:?set PI_KB_PROXY_NETWORK to your reverse proxy's docker network}

volumes:
  pi-kb-session:
