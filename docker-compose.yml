# Portainer stack for pi-kb-mcp (private, single-user HTTP server).
#
# Deploy in Portainer:  Stacks -> Add stack -> Repository
#   Repository URL:     https://github.com/nurnaufal321/pi-kb-mcp
#   Compose path:       docker-compose.yml   (Portainer's default)
#   Environment:        PI_KB_MCP_SECRET = <a long random string>
#
# Generate the secret with:
#   python -c 'import secrets; print(secrets.token_urlsafe(32))'
#
# This server holds YOUR AVEVA session. Anyone with the URL and the secret
# queries the knowledge base as you, under your entitlement and your identity.
# Keep both private; never advertise this endpoint.
services:
  pi-kb-mcp:
    build:
      context: .
      dockerfile: Dockerfile.serve
    image: pi-kb-mcp:serve
    restart: unless-stopped
    environment:
      # Required. The server exits at startup if this is under 24 characters.
      PI_KB_MCP_SECRET: ${PI_KB_MCP_SECRET:?set PI_KB_MCP_SECRET in the stack environment}
    volumes:
      # Your portal session cookies. Kept in a volume so they survive redeploys
      # and are never baked into the image.
      - pi-kb-session:/data
    ports:
      # Host side only; the container always listens on 8080 internally.
      # Defaults to loopback on an uncommon port to avoid clashing with whatever
      # else you run. Override in the stack environment, e.g.
      #   PI_KB_BIND=127.0.0.1:9123      different port, still private
      #   PI_KB_BIND=0.0.0.0:9123        reachable on the LAN (put TLS in front)
      # If your reverse proxy runs in Docker, prefer attaching it to this
      # service's network and deleting this ports section entirely.
      - "${PI_KB_BIND:-127.0.0.1:9123}:8080"
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request;urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  pi-kb-session:
