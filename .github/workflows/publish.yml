# Builds the Mode B image and publishes it to GitHub Container Registry, so
# hosts running this server only ever pull a finished image — no build cache,
# no intermediate layers, and no compiler on a small box.
name: Publish serve image

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "pyproject.toml"
      - "Dockerfile.serve"
      - ".github/workflows/publish.yml"
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.serve
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the published image
        run: |
          # The server must refuse to start without a strong secret.
          if docker run --rm -e PI_KB_MCP_SECRET=short ${{ env.IMAGE }}:latest; then
            echo "::error::server started without a valid secret"; exit 1
          fi
          # With a valid secret it must come up and answer /health.
          docker run -d --name kb -e PI_KB_MCP_SECRET=$(openssl rand -hex 24) \
            -p 8080:8080 ${{ env.IMAGE }}:latest
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/health; then ok=1; break; fi
            sleep 2
          done
          docker logs kb
          test "$ok" = 1 || { echo "::error::server never became healthy"; exit 1; }
